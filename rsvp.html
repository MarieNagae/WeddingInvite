<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/rsvp.css">
        
        <!--フォント用-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

        <title>Wedding Invitation</title>
    </head>

    <body>

        <section class="rsvp">
            <h2>RSVP</h2>

            <p class="description">
                ご出欠のご回答をお願いいたします。
            </p>

            <form id="rscpForm">
                <label>お名前</label>
                <div class="row">
                    <input type="text" placeholder="姓">
                    <input type="text" placeholder="名">
                </div>

                <label>フリガナ</label>
                <div class="row">
                    <input type="text" placeholder="セイ">
                    <input type="text" placeholder="メイ">
                </div>
                
                <label>電話番号(ハイフンなし)</label>
                <input type="tel" placeholder="08012345678">
                
                <label>ご出欠</label>
                <div class="radio-group">
                    <label><input type="radio" name="attendance" value="attend">出席</label>
                    <label><input type="radio" name="attendance" value="absent">欠席</label>
                </div>

                
                <label>新郎側・新婦側</label>
                <div class="radio-group">
                    <label><input type="radio" name="side" value="groom">新郎側</label>
                    <label><input type="radio" name="side" value="bride">新婦側</label>
                </div>
                
                <label>続柄</label>
                <select>
                    <option>家族・親戚</option>
                    <option>友人(小学校)</option>
                    <option>友人(中学校)</option>
                    <option>友人(高学校)</option>
                    <option>友人(大学校)</option>
                    <option>友人(社会人)</option>
                    <option>Other</option>
                </select>
                
                <label>アレルギー</label>
                <textarea rows="3"></textarea>
                
                <label class="checkbox">
                    <input type="checkbox" id="companionCheck">
                    同伴者（1人まで同伴可。同伴者のいるときはチェックしてください。）
                </label>
                
                <div id="companionArea">
                    <label>同伴者氏名</label>
                    <div class="row">
                        <input type="text" placeholder="姓">
                        <input type="text" placeholder="名">
                    </div>

                    <div class="row">
                        <input type="text" placeholder="セイ">
                        <input type="text" placeholder="メイ">
                    </div>
                    
                <label>同伴者アレルギー</label>
                <textarea rows="3"></textarea>
                </div>

                <label>メッセージ</label>
                <textarea rows="5"></textarea>

                
                <button type="submit">
                    回答する
                </button>
            </form>
        </section>


        
        <script src="js/rsvp.js"></script>
    </body>

</html>
