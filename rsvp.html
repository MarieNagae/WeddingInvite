<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/rsvp.css">
        
        <!--フォント用-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

        <title>Wedding Invitation</title>
    </head>

    <body>
        <form id="rsvpForm"  class="h-adr">
            <section class="rsvp">
                
                <a href="index.html" id="backLinkTop" class="back-link">
                    ← 戻る
                </a>

                <h2>RSVP</h2>

                <p class="description">
                    ご出欠のご回答をお願いいたします。
                </p>

                <label>お名前<a class="red-text">*</a></label>
                <div class="row">
                    <input type="text" placeholder="姓" id="lastName" name="lastName" maxlength="20"  data-rules="nameOnly,trim" required>
                    <input type="text" placeholder="名" id="firstName" name="firstName" maxlength="20" data-rules="nameOnly,trim" required>
                </div>

                <label>ふりがな<a class="red-text">*</a></label>
                <div class="row">
                    <input type="text" placeholder="せい" id="lastNameKana" name="lastNameKana" maxlength="20" data-rules="kanaOnly,trim" >
                    <input type="text" placeholder="めい" id="firstNameKana" name="firstNameKana" maxlength="20" data-rules="kanaOnly,trim" >
                </div>
                
                <label>電話番号(ハイフンなし)<a class="red-text">*</a></label>
                <input type="tel" placeholder="08012345678" inputmode="numeric" id="tell" name="tell" maxlength="11" data-rules="digitsOnly" >
                
                <label>メールアドレス<a class="red-text">*</a></label>
                <input type="email" placeholder="nnn@xxx.com" name="mail" autocomplete="email" maxlength="254"  data-rules="email" >
                
                <label>ご出欠<a class="red-text">*</a></label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="attendance" value="attend" checked>
                        出席
                    </label>
                    <label class="radio">
                        <input type="radio" name="attendance" value="absent">
                        欠席
                    </label>
                </div>

                
                <label>新郎側・新婦側<a class="red-text">*</a></label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="side" value="groom" checked>
                        新郎側
                    </label>
                    <label class="radio">
                        <input type="radio" name="side" value="bride">
                        新婦側
                    </label>
                </div>
                
                <label>続柄<a class="red-text">*</a></label>
                <select name="relation">
                    <option>家族・親戚</option>
                    <option>友人(小学校)</option>
                    <option>友人(中学校)</option>
                    <option>友人(高学校)</option>
                    <option>友人(大学校)</option>
                    <option>友人(社会人)</option>
                    <option>Other</option>
                </select>
                
                <span class="p-country-name" style="display:none;">Japan</span>
                <label>郵便番号<a class="red-text">*</a></label>
                <div class="postal-row">
                    <input
                        type="text"
                        id="postalCode"
                        name="postalCode"
                        placeholder="650-0046"
                        >

                    <button type="button" id="searchAddress"  class="search-btn">
                        住所検索
                    </button>
                </div>

                
                <label>住所（都道府県・市区町村）<a class="red-text">*</a></label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="住所"
                    >

                <label>住所（番地以降）</label>
                <input
                    type="text"
                    id="building"
                    name="building"
                    placeholder="建物名"
                    >


                <label>アレルギー</label>
                <textarea rows="3" id="allergy" name="allergy" maxlength="200" data-rules="removeControlChars"></textarea>
                
                <label class="checkbox">
                    <input type="checkbox" id="companionCheck" name="companion">
                    同伴者（1人まで同伴可。同伴者のいるときはチェックしてください。）
                </label>
                
                <div id="companionArea" class="companion-card">

                    <h3>👥 同伴者様情報</h3>
                    <label>同伴者氏名</label>
                    <div class="row">
                        <input type="text" placeholder="姓" id="compLastName" name="compLastName" maxlength="20" data-rules="nameOnly,trim" >
                        <input type="text" placeholder="名" id="compFirstName" name="compFirstName" maxlength="20" data-rules="nameOnly,trim" >
                    </div>

                    <div class="row">
                        <input type="text" placeholder="せい" id="compLastNameKana" name="compLastNameKana" maxlength="20" data-rules="kanaOnly,trim" >
                        <input type="text" placeholder="めい" id="compFirstNameKana" name="compFirstNameKana" maxlength="20" data-rules="kanaOnly,trim" >
                    </div>
                    

                    <label class="checkbox">
                        <input type="checkbox" id="compAddressSame" name="compAddressSame">
                        住所 同上
                    </label>

                    <div id="compAddressArea">
                        <label>郵便番号</label>
                        <div class="postal-row">
                            <input
                                type="text"
                                id="compPostalCode"
                                name="compPostalCode"
                                placeholder="650-0024"
                                >

                            <button type="button" id="compSearchAddress"  class="search-btn">
                                住所検索
                            </button>
                        </div>

                        
                        <label>住所（都道府県・市区町村）</label>
                        <input
                            type="text"
                            id="compAddress"
                            name="compAddress"
                            placeholder="住所">

                        <label>住所（番地以降）</label>
                        <input
                            type="text"
                            id="compBuilding"
                            name="compBuilding"
                            placeholder="建物名">
                    </div>

                    <label>同伴者アレルギー</label>
                    <textarea rows="3" id="compAllergy" name="compAllergy" maxlength="200" data-rules="removeControlChars" ></textarea>
                </div>

                <label>備考</label>
                <textarea rows="5" id="others" name="others" maxlength="500" data-rules="removeControlChars" ></textarea>

                <label>メッセージ</label>
                <textarea rows="5" name="Message" placeholder="新郎新婦へ一言！"></textarea>

                
                <button type="submit" id="submitButton" class="submit-btn">
                    回答する
                </button>

                <a href="index.html" id="backLinkBottom" class="back-link">
                    ← 戻る
                </a>
            </section>
        
        </form>
        <script type="module" src="js/rsvp.js"></script>
    </body>

</html>
