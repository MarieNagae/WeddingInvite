<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/rsvp.css">
        
        <!--フォント用-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

        <title>Wedding Invitation</title>
    </head>

    <body>
        <form id="rsvpForm">
            <section class="rsvp">
                
                <a href="index.html" id="backLink" class="back-link">
                    ← 戻る
                </a>

                <h2>RSVP</h2>

                <p class="description">
                    ご出欠のご回答をお願いいたします。
                </p>

                <label>お名前</label>
                <div class="row">
                    <input type="text" placeholder="姓" name="lastName">
                    <input type="text" placeholder="名" name="firstName">
                </div>

                <label>フリガナ</label>
                <div class="row">
                    <input type="text" placeholder="セイ" name="lastNameKana">
                    <input type="text" placeholder="メイ" name="firstNameKana">
                </div>
                
                <label>電話番号(ハイフンなし)</label>
                <input type="tel" placeholder="08012345678" name="tell">
                
                <label>メールアドレス</label>
                <input type="text" placeholder="nnn@xxx.com" name="mail">
                
                <label>ご出欠</label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="attendance" value="attend" checked>
                        出席
                    </label>
                    <label class="radio">
                        <input type="radio" name="attendance" value="absent">
                        欠席
                    </label>
                </div>

                
                <label>新郎側・新婦側</label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="side" value="groom" checked>
                        新郎側
                    </label>
                    <label class="radio">
                        <input type="radio" name="side" value="bride">
                        新婦側
                    </label>
                </div>
                
                <label>続柄</label>
                <select name="relation">
                    <option>家族・親戚</option>
                    <option>友人(小学校)</option>
                    <option>友人(中学校)</option>
                    <option>友人(高学校)</option>
                    <option>友人(大学校)</option>
                    <option>友人(社会人)</option>
                    <option>Other</option>
                </select>
                
                <label>住まい</label>
                <select name="address">
                    <option>大阪府</option>
                    <option>愛知県</option>
                    <option>東京都</option>
                    <option>北海道</option>
                    <option>青森県</option>
                    <option>岩手県</option>
                    <option>宮城県</option>
                    <option>秋田県</option>
                    <option>山形県</option>
                    <option>福島県</option>
                    <option>茨城県</option>
                    <option>栃木県</option>
                    <option>群馬県</option>
                    <option>千葉県</option>
                    <option>神奈川県</option>
                    <option>新潟県</option>
                    <option>富山県</option>
                    <option>石川県</option>
                    <option>福井県</option>
                    <option>山梨県</option>
                    <option>長野県</option>
                    <option>岐阜県</option>
                    <option>静岡県</option>
                    <option>三重県</option>
                    <option>滋賀県</option>
                    <option>京都府</option>
                    <option>兵庫県</option>
                    <option>奈良県</option>
                    <option>和歌山県</option>
                    <option>鳥取県</option>
                    <option>島根県</option>
                    <option>岡山県</option>
                    <option>広島県</option>
                    <option>山口県</option>
                    <option>徳島県</option>
                    <option>香川県</option>
                    <option>愛媛県</option>
                    <option>高知県</option>
                    <option>福岡県</option>
                    <option>佐賀県</option>
                    <option>長崎県</option>
                    <option>熊本県</option>
                    <option>大分県</option>
                    <option>宮崎県</option>
                    <option>鹿児島県</option>
                    <option>沖縄県</option>
                </select>


                <label>アレルギー</label>
                <textarea rows="3" name="allergy"></textarea>
                
                <label class="checkbox">
                    <input type="checkbox" id="companionCheck" name="companion">
                    同伴者（1人まで同伴可。同伴者のいるときはチェックしてください。）
                </label>
                
                <div id="companionArea">
                    <label>同伴者氏名</label>
                    <div class="row">
                        <input type="text" placeholder="姓" name="compLastName">
                        <input type="text" placeholder="名" name="compFirstName">
                    </div>

                    <div class="row">
                        <input type="text" placeholder="セイ" name="compLastNameKana">
                        <input type="text" placeholder="メイ" name="compFirstNameKana">
                    </div>
                    
                    <label>同伴者アレルギー</label>
                    <textarea rows="3" name="compAllergy"></textarea>

                    <label>住まい</label>
                    <select name="compAddress">
                        <option>大阪府</option>
                        <option>愛知県</option>
                        <option>東京都</option>
                        <option>北海道</option>
                        <option>青森県</option>
                        <option>岩手県</option>
                        <option>宮城県</option>
                        <option>秋田県</option>
                        <option>山形県</option>
                        <option>福島県</option>
                        <option>茨城県</option>
                        <option>栃木県</option>
                        <option>群馬県</option>
                        <option>千葉県</option>
                        <option>神奈川県</option>
                        <option>新潟県</option>
                        <option>富山県</option>
                        <option>石川県</option>
                        <option>福井県</option>
                        <option>山梨県</option>
                        <option>長野県</option>
                        <option>岐阜県</option>
                        <option>静岡県</option>
                        <option>三重県</option>
                        <option>滋賀県</option>
                        <option>京都府</option>
                        <option>兵庫県</option>
                        <option>奈良県</option>
                        <option>和歌山県</option>
                        <option>鳥取県</option>
                        <option>島根県</option>
                        <option>岡山県</option>
                        <option>広島県</option>
                        <option>山口県</option>
                        <option>徳島県</option>
                        <option>香川県</option>
                        <option>愛媛県</option>
                        <option>高知県</option>
                        <option>福岡県</option>
                        <option>佐賀県</option>
                        <option>長崎県</option>
                        <option>熊本県</option>
                        <option>大分県</option>
                        <option>宮崎県</option>
                        <option>鹿児島県</option>
                        <option>沖縄県</option>
                    </select>
                </div>

                <label>備考</label>
                <textarea rows="5" name="others"></textarea>

                <label>メッセージ</label>
                <textarea rows="5" name="Message"></textarea>

                
                <button type="submit" id="submitButton">
                    回答する
                </button>

                <a href="index.html" id="backLink" class="back-link">
                    ← 戻る
                </a>
            </section>
        
        </form>
        <script type="module" src="js/rsvp.js"></script>
    </body>

</html>
