<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/rsvp.css">
        
        <!--フォント用-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

        <title>Wedding Invitation</title>
    </head>

    <body>
        <form id="rsvpForm">
            <section class="rsvp">
                
                <a href="index.html" id="backLink" class="back-link">
                    ← 戻る
                </a>

                <h2>RSVP</h2>

                <p class="description">
                    ご出欠のご回答をお願いいたします。
                </p>

                <label>お名前</label>
                <div class="row">
                    <input type="text" placeholder="姓" name="lastName">
                    <input type="text" placeholder="名" name="firstName">
                </div>

                <label>フリガナ</label>
                <div class="row">
                    <input type="text" placeholder="セイ" name="lastNameKana">
                    <input type="text" placeholder="メイ" name="firstNameKana">
                </div>
                
                <label>電話番号(ハイフンなし)</label>
                <input type="tel" placeholder="08012345678" name="tell">
                
                <label>メールアドレス</label>
                <input type="text" placeholder="nnn@xxx.com" name="mail">
                
                <label>ご出欠</label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="attendance" value="attend">
                        出席
                    </label>
                    <label class="radio">
                        <input type="radio" name="attendance" value="absent">
                        欠席
                    </label>
                </div>

                
                <label>新郎側・新婦側</label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="side" value="groom">
                        新郎側
                    </label>
                    <label class="radio">
                        <input type="radio" name="side" value="bride">
                        新婦側
                    </label>
                </div>
                
                <label>続柄</label>
                <select name="relation">
                    <option>家族・親戚</option>
                    <option>友人(小学校)</option>
                    <option>友人(中学校)</option>
                    <option>友人(高学校)</option>
                    <option>友人(大学校)</option>
                    <option>友人(社会人)</option>
                    <option>Other</option>
                </select>
                
                <label>アレルギー</label>
                <textarea rows="3" name="allergy"></textarea>
                
                <label class="checkbox">
                    <input type="checkbox" id="companionCheck" name="companion">
                    同伴者（1人まで同伴可。同伴者のいるときはチェックしてください。）
                </label>
                
                <div id="companionArea">
                    <label>同伴者氏名</label>
                    <div class="row">
                        <input type="text" placeholder="姓" name="compLastName">
                        <input type="text" placeholder="名" name="compFirstName">
                    </div>

                    <div class="row">
                        <input type="text" placeholder="セイ" name="compLastNameKana">
                        <input type="text" placeholder="メイ" name="compFirstNameKana">
                    </div>
                    
                <label>同伴者アレルギー</label>
                <textarea rows="3" name="compAllergy"></textarea>
                </div>

                <label>備考</label>
                <textarea rows="5" name="others"></textarea>

                <label>メッセージ</label>
                <textarea rows="5" name="Message"></textarea>

                
                <button type="submit" id="submitButton">
                    回答する
                </button>

                <a href="index.html" id="backLink" class="back-link">
                    ← 戻る
                </a>
            </section>
        
        </form>
        <script type="module" src="js/rsvp.js"></script>
    </body>

</html>
