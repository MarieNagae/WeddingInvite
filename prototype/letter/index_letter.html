<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="scene">

    <!-- 手紙 -->
    <div class="letter">
        
        <p class="letter-to">
            Dear 稲井 様
        </p>

        <p class="letter-text">
            このたび私たちは<br>
            結婚式を挙げることとなりました。<br><br>

            大切な皆さまへ<br>
            感謝の気持ちを込めて。
        </p>

        <p class="letter-from">
            Takuma & Marie
        </p>
    </div>

    <!-- 封筒 -->
    <div class="envelope" id="envelope">

        <div class="envelope-back"></div>

        <div class="flap left-flap"></div>
        <div class="flap right-flap"></div>
        <div class="flap bottom-flap"></div>

        <div class="top-flap">
            <div class="top-flap-inner"></div>
        </div>

        <div class="seal">
            <span>W</span>
        </div>

    </div>

    <p class="tap-text" id="tapText">
        Tap to Open
    </p>






</div>

    <script type="module" src="./js/script.js"></script>

</body>

</html>
