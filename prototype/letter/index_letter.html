<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="scene">

        <div class="envelope" id="envelope">

            <!-- ====================
                 手紙
            ==================== -->

            <div class="letter-mask">

                <div class="letter">

                    <p class="letter-to">
                        Dear ○○ 様
                    </p>

                    <p class="letter-text">
                        このたび私たちは<br>
                        結婚式を挙げることとなりました。<br><br>

                        大切な皆さまへ<br>
                        感謝の気持ちを込めて。
                    </p>

                    <p class="letter-from">
                        Marie & Takuma
                    </p>

                </div>

            </div>


            <!-- ====================
                 封筒
            ==================== -->

            <div class="envelope-back"></div>

            <div class="flap left-flap"></div>

            <div class="flap right-flap"></div>

            <div class="flap bottom-flap"></div>

            <!-- 上のフタ -->
            <div class="top-flap">

                <div class="top-flap-inner"></div>

            </div>


            <!-- ====================
                 シーリングスタンプ
            ==================== -->

            <div class="seal">

                <span>W</span>

            </div>

        </div>


        <!-- ====================
             タップ案内
        ==================== -->

        <p class="tap-text" id="tapText">
            Tap to Open
        </p>

    </main>


    <script type="module" src="./js/script.js"></script>

</body>

</html>
