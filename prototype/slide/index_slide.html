<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="kobe-panorama">

    <div class="panorama-wrapper">

        <!-- KOBE -->
        <div class="panorama-page">

            <img
                src="images/top/kobe-panorama.jpg"
                alt="Kobe"
            >

            <div class="panorama-text">
                <p>KOBE</p>
                <span>our favorite city</span>
            </div>

        </div>


        <!-- OUR STORY -->
        <div class="panorama-page">

            <img
                src="images/top/our-story.jpg"
                alt="Our Story"
            >

            <div class="panorama-text">
                <p>OUR STORY</p>
                <span>the city where our story began</span>
            </div>

        </div>


        <!-- WEDDING -->
        <div class="panorama-page">

            <img
                src="images/top/wedding.jpg"
                alt="Wedding"
            >

            <div class="panorama-text">
                <p>WEDDING</p>
                <span>January 30, 2027</span>
            </div>

        </div>

    </div>


    <div class="panorama-guide">
        ← swipe to explore →
    </div>

</section>


    <script type="module" src="./js/script.js"></script>

</body>

</html>
