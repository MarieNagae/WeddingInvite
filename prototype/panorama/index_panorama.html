<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
</head>

<body>

<section class="kobe-panorama">

    <div class="panorama-wrapper">

        <div class="panorama-content">

            <!-- パノラマ写真 -->
            <img
                src="images/top/kobe-panorama2.jpg"
                alt="Kobe panorama"
            >

            <!-- タイトル -->
            <div class="panorama-text">
                <p>KOBE</p>
                <span>our favorite city</span>
            </div>


        <!-- 最初のメッセージ -->
        <div class="panorama-message messageStory1" id="messageStory1">
            Thank you 
        </div>

        
        <div class="panorama-message messageStory2" id="messageStory2">
            for being a part of our story.
        </div>


        <div class="panorama-message message-date" id="messageDate">
            January 30, 2027
        </div>


        <!-- 時間 -->
        <div
            class="panorama-message message-time"
            id="messageTime"
        >
            12:30 PM
        </div>


        <!-- 会場 -->
        <div
            class="panorama-message message-venue"
            id="messageVenue"
        >
            Notre Dame Kobe
        </div>

        </div>

    </div>

    <!-- スワイプ案内 -->
    <p class="panorama-guide">
        ← swipe to explore →
    </p>

</section>



    <script type="module" src="./js/script.js"></script>

</body>

</html>
