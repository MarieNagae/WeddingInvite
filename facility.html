<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/facility.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="hero">
        <img src="images/facility/hero.jpg" alt="Facility">
        <div class="overlay">
            <h1>Facility</h1>
        </div>
    </div>

    <div class="content">

        <div class="card">
            <div class="icon">🧥</div>
            <div>
                <h2>クローク</h2>
                <p>受付横にございます。お荷物やコートをお預けいただけます。</p>
            </div>
        </div>

        <div class="card">
            <div class="icon">🚬</div>
            <div>
                <h2>喫煙所</h2>
                <p>館内に喫煙スペースをご用意しております。</p>
            </div>
        </div>

        <div class="card">
            <div class="icon">👶</div>
            <div>
                <h2>授乳室・おむつ替え</h2>
                <p>小さなお子様連れの方も安心してご利用いただけます。</p>
            </div>
        </div>

        <div class="card">
            <div class="icon">♿</div>
            <div>
                <h2>バリアフリー</h2>
                <p>車椅子をご利用の方も安心してご来館いただけます。</p>
            </div>
        </div>

        <div class="card">
            <div class="icon">🚗</div>
            <div>
                <h2>駐車場</h2>
                <p>専用駐車場をご利用いただけます。</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
