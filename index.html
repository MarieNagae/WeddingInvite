<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        
        <!--フォント用-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

        <title>Wedding Invitation</title>
    </head>

    <body>
        <!--左サイド-->
        <aside class="side left"></aside>

        <!--携帯表示画面-->
        <main class="phone">
            <section class="hero">
                <!--Top画面-->
                <img src="images/top/Hero.jpg" alt="Wedding Hero"  class="hero-img">

                <!--タイトル文字列表示-->
                <!--Wedding-->
                <h1 class="hero-title">
                    <span>W</span>
                    <span>e</span>
                    <span>d</span>
                    <span>d</span>
                    <span>i</span>
                    <span>n</span>
                    <span>g</span>
                </h1>
                
                <!--Invitation-->
                <h1 class="hero-title second">
                    <span>I</span>
                    <span>n</span>
                    <span>v</span>
                    <span>i</span>
                    <span>t</span>
                    <span>a</span>
                    <span>t</span>
                    <span>i</span>
                    <span>o</span>
                    <span>n</span>
                </h1>


            </section>

            <section class="message">
                <h2 class="section-title">Message</h2>
            
                <p class="message-text">
                    皆様いかがお過ごしでしょうか<br>
                    このたび　私たちは結婚式を挙げることになりました<br>
                    つきましては　ご挨拶をかねて<br>
                    ささやかなパーティを催したいと思います。<br>
                    ご多用の中　誠に恐縮ではございますが<br>
                    ぜひご出席いただきたくご案内申し上げます<br><br>

                    敬具<br>
                    令和8年7月3日吉日<br><br>
                    
                    稲井　琢真<br>
                    永江　茉理恵<br>
                </p>
            </section>
            
        </main>
    </body>

    <!--右サイド-->
    <aside class="side right"></aside>
</html>
