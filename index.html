<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="css/horizontal.css">
    <link rel="apple-touch-icon" href="/images/favicon.png">

</head>

<body>

    <main id="slider"></main>
    <div id="swipeGuide">
        <!-- 中央のSWIPEガイド -->
        <div class="swipe-guide-center">
            <span>←</span>
            <span>SWIPE</span>
            <span>→</span>
        </div>

        <!-- 画面両端の矢印 -->
        <span class="edge-arrow edge-arrow-left">‹</span>
        <span class="edge-arrow edge-arrow-right">›</span>
    </div>


    <div id="pageCounter">

        <button id="menuToggle" type="button">
            <span>MENU</span>
            <span class="menu-icon">+</span>
        </button>

        <div id="pageNumbers"></div>
        
        <div style="display:none;">
            <span id="currentPage">01</span>
            <span id="totalPage">08</span>
        </div>

    </div>

    <!-- メニュー展開 -->
    <div id="menuOverlay">
        <div id="menuContent">

            <div class="menu-title">MENU</div>

            <div id="menuList"></div>

            <button id="menuClose" type="button">
                X CLOSE
            </button>

        </div>
    </div>

    <script type="module" src="js/horizontal.js"></script>

</body>
</html>
